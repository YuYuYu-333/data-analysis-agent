# Render Blueprint：导入仓库即可部署
# 免费层没有持久磁盘，所以启动时先跑一次 generate_data.py 重建数据库
services:
  - type: web
    name: data-analysis-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/generate_data.py && uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: API_KEY
        sync: false
